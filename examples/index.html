<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>h3x - Nhà ống 4x16</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #plan,
      #app {
        position: fixed;
        top: 0;
        bottom: 0;
      }
      #plan {
        left: 0;
        width: 50%;
        border-right: 1px solid #ccc;
        background: #fff;
      }
      #app {
        left: 50%;
        right: 0;
      }
      @media (max-width: 700px) {
        #plan {
          right: 0;
          width: auto;
          bottom: 50%;
          border-right: 0;
          border-bottom: 1px solid #ccc;
        }
        #app {
          left: 0;
          top: 50%;
        }
      }
      #toolbar {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        padding: 8px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 8px;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.2);
      }
      #toolbar button {
        padding: 6px 10px;
        cursor: pointer;
      }
      #status {
        font-size: 13px;
        color: #2a7a3b;
      }
      #status.error {
        color: #b3261e;
      }
    </style>
  </head>
  <body>
    <div id="plan"></div>
    <div id="app"></div>
    <div id="toolbar">
      <button id="btn-select">Chọn</button>
      <button id="btn-wall">Vẽ tường</button>
      <button id="btn-site">Vẽ khu đất</button>
      <button id="btn-column-round">Cột tròn</button>
      <button id="btn-column-square">Cột vuông</button>
      <button id="btn-clear">Xóa hết</button>
      <button id="btn-load">Nhà mẫu</button>
      <button id="btn-projection">Phối cảnh / Trực giao</button>
      <button id="btn-top">Nhìn từ trên</button>
      <button id="btn-widen">Mở rộng nhà +0,5 m</button>
      <button id="btn-undo">Hoàn tác</button>
      <button id="btn-redo">Làm lại</button>
      <span id="status"></span>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
