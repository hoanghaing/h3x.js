<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>h3x - Nhà ống / Nhà phố</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #plan,
      #app {
        position: fixed;
        top: 0;
        bottom: 0;
      }
      #plan {
        left: 0;
        width: 50%;
        border-right: 1px solid #ccc;
        background: #fff;
      }
      #app {
        left: 50%;
        right: 0;
      }
      @media (max-width: 700px) {
        #plan {
          right: 0;
          width: auto;
          bottom: 50%;
          border-right: 0;
          border-bottom: 1px solid #ccc;
        }
        #app {
          left: 0;
          top: 50%;
        }
      }
      #toolbar {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        padding: 8px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 8px;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.2);
      }
      #floorbar {
        position: fixed;
        bottom: 12px;
        left: 12px;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        padding: 8px;
        font-size: 13px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 8px;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.2);
      }
      #floorbar input {
        width: 5em;
      }
      #toolbar button,
      #floorbar button {
        padding: 6px 10px;
        cursor: pointer;
      }
      #stairbar {
        position: fixed;
        bottom: 12px;
        right: 12px;
        z-index: 10;
        display: none;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        padding: 8px;
        font-size: 13px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 8px;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.2);
      }
      #stairbar input,
      #openingbar input {
        width: 5em;
      }
      #openingbar {
        position: fixed;
        bottom: 12px;
        right: 12px;
        z-index: 10;
        display: none;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        max-width: 46%;
        padding: 8px;
        font-size: 13px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 8px;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.2);
      }
      #quantities {
        position: fixed;
        top: 64px;
        right: 12px;
        z-index: 11;
        width: min(440px, calc(100vw - 24px));
        max-height: calc(100vh - 140px);
        overflow: auto;
        padding: 8px 10px;
        font-size: 12px;
        background: rgba(255, 255, 255, 0.97);
        border-radius: 8px;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.2);
      }
      #quantities[hidden] {
        display: none;
      }
      #quantities header {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #quantities header strong {
        flex: 1;
        font-size: 14px;
      }
      #quantities h4 {
        margin: 10px 0 4px;
      }
      #quantities table {
        width: 100%;
        border-collapse: collapse;
      }
      #quantities th,
      #quantities td {
        padding: 2px 4px;
        text-align: left;
        border-bottom: 1px solid #eee;
        white-space: nowrap;
      }
      #quantities .num {
        text-align: right;
      }
      #quantities input {
        width: 7.5em;
      }
      #quantities tfoot th {
        font-size: 13px;
      }
      #quantities-unpriced {
        margin: 6px 0 0;
        color: #b3261e;
      }
      #groupbar {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        font-size: 13px;
      }
      #groupbar input {
        width: 3.5em;
      }
      #toolbar button.active {
        background: #d8e8ff;
      }
      #status {
        font-size: 13px;
        color: #2a7a3b;
      }
      #status.error {
        color: #b3261e;
      }
    </style>
  </head>
  <body>
    <div id="plan"></div>
    <div id="app"></div>
    <div id="toolbar">
      <button id="btn-select">Chọn</button>
      <button id="btn-delete" title="Xoá đối tượng đang chọn (Delete)">Xoá</button>
      <span
        id="groupbar"
        title="Shift / Ctrl + nhấp để chọn thêm; Shift + kéo ở chỗ trống để chọn bằng khung"
      >
        <button id="btn-rotate" title="Xoay vùng chọn 90° quanh tâm">Xoay 90°</button>
        <button id="btn-mirror-x" title="Lật trái - phải">Lật ngang</button>
        <button id="btn-mirror-y" title="Lật trên - dưới">Lật dọc</button>
        <label>Dời <input id="in-move-x" type="number" step="0.1" value="1" /></label>
        <label><input id="in-move-y" type="number" step="0.1" value="0" /></label>
        <button id="btn-move" title="Dời vùng chọn theo x, y (m)">Dời</button>
        <button id="btn-copy" title="Sao chép vùng chọn (Ctrl + C)">Sao chép</button>
        <button
          id="btn-paste"
          title="Dán đúng chỗ đã chép, vd. sang tầng khác (Ctrl + Shift + V; Ctrl + V dán tại con trỏ)"
        >
          Dán
        </button>
        <button id="btn-duplicate" title="Nhân bản lệch 1 m (Ctrl + D)">Nhân bản</button>
        <label>Nhân <input id="in-array-count" type="number" min="1" step="1" value="3" /></label>
        <button id="btn-array" title="Tạo N bản, mỗi bản lệch thêm x, y của ô Dời">lần</button>
        <select id="sel-align" title="Căn cột, cầu thang, đồ đạc, mái đang chọn">
          <option value="left">Căn trái</option>
          <option value="right">Căn phải</option>
          <option value="top">Căn trên</option>
          <option value="bottom">Căn dưới</option>
          <option value="centerX">Giữa (ngang)</option>
          <option value="centerY">Giữa (dọc)</option>
        </select>
        <button id="btn-align">Căn</button>
        <button id="btn-lock" title="Khoá vùng chọn: không sửa, xoá được nữa">Khoá</button>
        <button id="btn-unlock">Mở khoá</button>
        <button
          id="btn-measure"
          title="Đo: nhấp từng điểm, nhấp lại điểm đầu để có diện tích; Esc xoá"
        >
          Đo
        </button>
      </span>
      <button id="btn-wall">Vẽ tường</button>
      <select id="sel-wall-ref" title="Đường đang vẽ là tim tường hay một mặt tường">
        <option value="center">Theo tim</option>
        <option value="left">Mặt trái</option>
        <option value="right">Mặt phải</option>
      </select>
      <button id="btn-site">Vẽ khu đất</button>
      <button id="btn-column-round">Cột tròn</button>
      <button id="btn-column-square">Cột vuông</button>
      <button id="btn-stair">Cầu thang</button>
      <button id="btn-opening" title="Nhấp lên tường để đặt; Space đổi chiều, Alt bỏ bám">
        Cửa
      </button>
      <select id="sel-opening-preset" title="Mẫu cửa">
        <option value="door-single-01">Cửa đi 1 cánh</option>
        <option value="door-double-01">Cửa đi 2 cánh</option>
        <option value="door-double-unequal-01">Cửa 2 cánh lệch</option>
        <option value="door-sliding-01">Cửa trượt</option>
        <option value="door-folding-01">Cửa xếp</option>
        <option value="door-rolling-01">Cửa cuốn</option>
        <option value="opening-01">Ô trống</option>
        <option value="window-01">Cửa sổ cố định</option>
        <option value="window-casement-01">Cửa sổ mở quay</option>
        <option value="window-sliding-01">Cửa sổ lùa</option>
        <option value="window-awning-01">Cửa sổ lật</option>
      </select>
      <button id="btn-clear">Xóa hết</button>
      <button id="btn-load">Nhà ống</button>
      <button id="btn-load-3f">Nhà phố 3 tầng</button>
      <button id="btn-load-trap">Nhà phố hình thang</button>
      <button id="btn-roof">Vẽ mái</button>
      <select id="sel-roof-preset" title="Kiểu mái">
        <option value="thai">Mái Thái</option>
        <option value="japanese">Mái Nhật</option>
        <option value="metal">Mái tôn</option>
        <option value="traditional">Mái truyền thống</option>
        <option value="gable">Mái hai dốc</option>
        <option value="hip">Mái bốn dốc</option>
        <option value="shed">Mái một dốc</option>
        <option value="mansard">Mansard</option>
        <option value="gambrel">Gambrel</option>
        <option value="flat">Mái bằng</option>
        <option value="glass-frame">Mái kính</option>
        <option value="poly-frame">Mái polycarbonate</option>
      </select>
      <select id="sel-roof-mode" title="Chế độ vẽ mái">
        <option value="follow">Theo tường</option>
        <option value="draw">Vẽ đa giác</option>
      </select>
      <label><input id="chk-roofs" type="checkbox" checked /> Hiện mái</label>
      <button id="btn-projection">Phối cảnh / Trực giao</button>
      <button id="btn-top">Nhìn từ trên</button>
      <button id="btn-widen">Mở rộng nhà +0,5 m</button>
      <button id="btn-undo">Hoàn tác</button>
      <button id="btn-redo">Làm lại</button>
      <button id="btn-quantities" title="Khối lượng và dự toán">Khối lượng</button>
      <span id="status"></span>
    </div>
    <aside id="quantities" hidden>
      <header>
        <strong>Khối lượng</strong>
        <select id="sel-quantities-scope" title="Phạm vi">
          <option value="project">Cả công trình</option>
          <option value="floor">Tầng đang chọn</option>
        </select>
        <button id="btn-quantities-close" title="Đóng">✕</button>
      </header>
      <table>
        <tbody id="quantities-summary"></tbody>
      </table>
      <h4>Cửa</h4>
      <table>
        <thead>
          <tr>
            <th>Loại</th>
            <th>Rộng × cao</th>
            <th class="num">Số bộ</th>
            <th class="num">Thành tiền</th>
          </tr>
        </thead>
        <tbody id="quantities-openings"></tbody>
      </table>
      <h4>Dự toán (đơn giá minh họa, VND)</h4>
      <table>
        <thead>
          <tr>
            <th>Hạng mục</th>
            <th class="num">Khối lượng</th>
            <th>Đơn giá</th>
            <th class="num">Thành tiền</th>
          </tr>
        </thead>
        <tbody id="quantities-costs"></tbody>
        <tbody>
          <tr>
            <td>Cửa đi</td>
            <td></td>
            <td>
              <input id="in-price-door" type="number" min="0" step="100000" value="3500000" /> /bộ
            </td>
            <td></td>
          </tr>
          <tr>
            <td>Cửa sổ</td>
            <td></td>
            <td>
              <input id="in-price-window" type="number" min="0" step="100000" value="2500000" /> /bộ
            </td>
            <td></td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <th colspan="3">Tổng</th>
            <th id="quantities-total" class="num"></th>
          </tr>
        </tfoot>
      </table>
      <p id="quantities-unpriced"></p>
    </aside>
    <div id="floorbar">
      <label
        >Tầng
        <select id="sel-floor"></select
      ></label>
      <button id="btn-floor-above">Thêm tầng trên</button>
      <button id="btn-floor-below">Thêm tầng dưới</button>
      <button id="btn-floor-remove">Xóa tầng</button>
      <label>Cao tường <input id="in-wall-height" type="number" step="0.1" min="0.1" /></label>
      <label>Dày sàn <input id="in-slab" type="number" step="0.01" min="0.01" /></label>
      <label>Cao độ nền <input id="in-ground" type="number" step="0.05" /></label>
      <label
        >Chế độ xem
        <select id="sel-view">
          <option value="all">Cả nhà</option>
          <option value="cutaway">Tầng này + dưới (cắt)</option>
          <option value="active">Chỉ tầng này</option>
        </select>
      </label>
    </div>
    <div id="stairbar">
      <label
        >Cầu thang
        <select id="sel-stair-type">
          <option value="straight">Thẳng</option>
          <option value="L">Chữ L</option>
          <option value="U">Chữ U</option>
          <option value="spiral">Xoắn ốc</option>
        </select>
      </label>
      <label
        >Chiếu
        <select id="sel-stair-turn">
          <option value="landing">Chiếu nghỉ</option>
          <option value="winder">Bậc quạt</option>
        </select>
      </label>
      <button id="btn-stair-hand">Tay phải</button>
      <label>Bề rộng vế <input id="in-stair-width" type="number" step="0.05" min="0.1" /></label>
      <button id="btn-stair-rotate">Xoay 90°</button>
    </div>
    <div id="openingbar">
      <label
        >Loại
        <select id="sel-opening-type">
          <option value="door-swing">Cửa đi 1 cánh</option>
          <option value="door-double">Cửa đi 2 cánh</option>
          <option value="door-sliding">Cửa trượt</option>
          <option value="door-folding">Cửa xếp</option>
          <option value="door-rolling">Cửa cuốn</option>
          <option value="opening">Ô trống</option>
          <option value="window-casement">Cửa sổ mở quay</option>
          <option value="window-sliding">Cửa sổ lùa</option>
          <option value="window-awning">Cửa sổ lật</option>
          <option value="window-fixed">Cửa sổ cố định</option>
        </select>
      </label>
      <label>Rộng <input id="in-opening-width" type="number" step="0.05" min="0.05" /></label>
      <label>Cao <input id="in-opening-height" type="number" step="0.05" min="0.05" /></label>
      <label>Bậu <input id="in-opening-sill" type="number" step="0.05" min="0" /></label>
      <label
        >Bản lề
        <select id="sel-opening-hinge">
          <option value="a">Đầu A</option>
          <option value="b">Đầu B</option>
        </select>
      </label>
      <label
        >Mở về
        <select id="sel-opening-swing">
          <option value="left">Bên trái</option>
          <option value="right">Bên phải</option>
        </select>
      </label>
      <label>Số cánh <input id="in-opening-leaves" type="number" step="1" min="1" /></label>
      <label
        >Tỉ lệ cánh <input id="in-opening-split" type="number" step="0.01" min="0.5" max="0.99"
      /></label>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
